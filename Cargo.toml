[workspace]
members = [
    "rust/*",
    "leptos-csr/*", 
]
resolver = "3"

[workspace.dependencies]
# rust
serde = { version="1.0.229", features=["derive"]}
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }
# letos
console_error_panic_hook = "0.1.7"
leptos = "0.8.23"
leptos_router = "0.8.17"

# Brower/WASM bindings
web-sys = { version = "0.3", features = [
    "Blob", "CloseEvent", "CustomEvent", "DataTransfer", "Document",
    "DragEvent", "Element", "Event", "EventSource", "EventTarget", "File",
    "FileList", "FileReader", "FormData", "HtmlElement", "HtmlFormElement",
    "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement",
    "IntersectionObserver", "IntersectionObserverEntry", "KeyboardEvent",
    "Location", "MessageEvent", "Navigator", "Performance", "ProgressEvent",
    "Storage", "Url", "WebSocket", "Window", "XmlHttpRequest",
    "XmlHttpRequestUpload", "console","Clipboard",
] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
gloo-net = "0.8.0"
gloo-storage = "0.4.1"
gloo-timers = {version = "0.4.1", features = ["futures"]}
gloo-events = "0.3.1"
js-sys = "0.3.107"